<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1f44">
<title>lucky作业通</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:24px 14px;min-height:100vh;
  background:#0a1f44;color:#fff;
  font-family:system-ui,"Microsoft Yahei",sans-serif
}
.container{max-width:720px;margin:auto}
h1{text-align:center;color:#e8f1ff;margin-bottom:8px}
.subtitle{text-align:center;color:#9db8e0;font-size:14px;margin-bottom:24px}
.card{
  background:#122c5c;border-radius:12px;padding:22px;
  margin-bottom:20px;box-shadow:0 4px 16px #0003
}
h2{font-size:19px;color:#d6e4ff;margin-top:0}
textarea,input{
  width:100%;padding:13px;border:1px solid #274574;
  border-radius:8px;background:#0d244e;color:#fff;font:inherit
}
textarea{min-height:130px;resize:vertical}
textarea::placeholder,input::placeholder{color:#8aa4cc}
button{
  border:0;border-radius:8px;background:#2563eb;color:#fff;
  padding:11px 18px;font:inherit;cursor:pointer;margin-top:12px
}
button:disabled{opacity:.6}
.secondary{background:#29436e}
.tip{font-size:13px;line-height:1.6;color:#9db8e0}
.status{margin-top:12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-item{background:#0d244e;padding:14px;border-radius:8px;margin:12px 0}
.msg-content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.msg-time{font-size:12px;color:#9db8e0;margin-top:8px}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
  <h1>✅ lucky作业通</h1>
  <div class="subtitle">匿名提交 · 云端同步</div>

  <section class="card">
    <h2>提交建议</h2>
    <textarea id="content" maxlength="2000"
      placeholder="请输入你的建议或反馈，最多2000字"></textarea>
    <button id="submitBtn">提交消息</button>
    <button class="secondary" id="refreshBtn">刷新消息</button>
    <p class="tip">请勿提交密码、手机号、住址等个人隐私信息。</p>
    <div id="submitStatus" class="status"></div>
  </section>

  <section class="card">
    <h2>最新消息 <span id="count"></span></h2>
    <div id="messages">正在加载云端消息…</div>
    <div id="listStatus" class="status"></div>
  </section>

  <section class="card">
    <h2>开发者面板</h2>
    <input id="devKey" type="password" placeholder="开发者密钥">
    <button id="unlockBtn">进入面板</button>
    <button id="exportBtn" class="hidden">导出 CSV</button>
    <button id="lockBtn" class="secondary hidden">退出面板</button>
    <p class="tip">开发者密码仅用于本页的简单验证，不是安全的服务器端认证。</p>
    <div id="devStatus" class="status"></div>
  </section>
</div>

<script>
/* ===== Supabase 配置 ===== */
const SUPABASE_URL =
  "https://mlfgkximylqcggggfmdf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_QTjDwTuc4F-AW38DxBfbdg_SCSdYQo_";

/* 仅用于显示导出按钮，不具备真正的管理员安全性 */
const DEV_KEY = "lqy825825";

const $ = id => document.getElementById(id);
let messages = [];
let unlocked = false;

function configured(){
  return SUPABASE_KEY.startsWith("sb_publishable_");
}

async function api(path, options = {}){
  const response = await fetch(
    SUPABASE_URL + "/rest/v1/" + path,
    {
      ...options,
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:"Bearer " + SUPABASE_KEY,
        "Content-Type":"application/json",
        ...(options.headers || {})
      }
    }
  );

  if(!response.ok){
    const errorText = await response.text();
    throw new Error(errorText || "HTTP " + response.status);
  }

  const text = await response.text();
  return text ? JSON.parse(text) : null;
}

function timeText(value){
  if(!value) return "时间未知";
  const date = new Date(value);
  return isNaN(date.getTime())
    ? String(value)
    : date.toLocaleString("zh-CN",{hour12:false});
}

function status(id, text){
  $(id).textContent = text;
}

async function loadMessages(){
  if(!configured()){
    status("listStatus","请先填写 Supabase Publishable key。");
    return;
  }

  $("refreshBtn").disabled = true;

  try{
    const rows = await api(
      "suggestions?select=id,content,create_time&order=id.desc&limit=500"
    );

    messages = rows || [];

    const host = $("messages");
    host.replaceChildren();

    $("count").textContent = "（共 " + messages.length + " 条）";

    if(messages.length === 0){
      host.textContent = "暂时没有消息。";
    }

    for(const item of messages){
      const article = document.createElement("article");
      article.className = "msg-item";

      const content = document.createElement("div");
      content.className = "msg-content";
      content.textContent = item.content;

      const time = document.createElement("div");
      time.className = "msg-time";
      time.textContent = timeText(item.create_time);

      article.append(content,time);
      host.appendChild(article);
    }

    status("listStatus","云端消息已同步。");
  }catch(error){
    status("listStatus",
      "读取失败，请检查 Publishable key、Data API 和 RLS 读取策略。\n"
      + error.message
    );
  }finally{
    $("refreshBtn").disabled = false;
  }
}

$("submitBtn").addEventListener("click", async()=>{
  const content = $("content").value.trim();

  if(!content){
    status("submitStatus","请输入消息内容。");
    return;
  }

  if(!configured()){
    status("submitStatus","请先配置 Supabase Publishable key。");
    return;
  }

  $("submitBtn").disabled = true;
  status("submitStatus","正在提交…");

  try{
    await api("suggestions",{
      method:"POST",
      headers:{"Prefer":"return=minimal"},
      body:JSON.stringify({content})
    });

    $("content").value = "";
    status("submitStatus","提交成功！");
    await loadMessages();
  }catch(error){
    status("submitStatus",
      "提交失败，请检查 INSERT RLS 策略。\n" + error.message
    );
  }finally{
    $("submitBtn").disabled = false;
  }
});

$("refreshBtn").addEventListener("click",loadMessages);

$("unlockBtn").addEventListener("click",()=>{
  if($("devKey").value === DEV_KEY){
    unlocked = true;
    $("devKey").classList.add("hidden");
    $("unlockBtn").classList.add("hidden");
    $("exportBtn").classList.remove("hidden");
    $("lockBtn").classList.remove("hidden");
    status("devStatus","已进入面板，可以导出当前加载的消息。");
  }else{
    status("devStatus","密钥错误。");
  }
});

$("lockBtn").addEventListener("click",()=>{
  unlocked = false;
  $("devKey").value = "";
  $("devKey").classList.remove("hidden");
  $("unlockBtn").classList.remove("hidden");
  $("exportBtn").classList.add("hidden");
  $("lockBtn").classList.add("hidden");
  status("devStatus","已退出面板。");
});

$("exportBtn").addEventListener("click",()=>{
  if(!unlocked) return;

  const quote = value =>
    '"' + String(value ?? "").replace(/"/g,'""') + '"';

  const csv = "\uFEFF" + [
    ["id","content","create_time"],
    ...messages.map(item=>[
      item.id,item.content,item.create_time
    ])
  ].map(row=>row.map(quote).join(",")).join("\r\n");

  const blob = new Blob([csv],{
    type:"text/csv;charset=utf-8;"
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "lucky-zuoyetong-messages.csv";
  a.click();
  URL.revokeObjectURL(url);
});

loadMessages();
</script>
</body>
</html>
