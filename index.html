
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10203a">
  <title>lucky作业通 · 留言板</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px; background: #f2f5fa; color: #18243a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei", sans-serif;
    }
    .container { max-width: 720px; margin: 0 auto; }
    header {
      padding: 24px; color: white;
      background: linear-gradient(135deg, #10203a, #244e83);
      border-radius: 18px; margin-bottom: 18px;
    }
    header h1 { margin: 0 0 8px; font-size: 26px; }
    header p { margin: 0; color: #d7e5f8; font-size: 14px; }
    .panel {
      background: white; padding: 20px; border-radius: 16px;
      margin-bottom: 18px; box-shadow: 0 4px 18px #10203a0c;
    }
    h2 { font-size: 18px; margin: 0 0 14px; }
    textarea, input {
      display: block; width: 100%; padding: 12px;
      border: 1px solid #d6dce6; border-radius: 10px;
      font: inherit; background: white; color: #18243a;
      margin: 8px 0 12px;
    }
    textarea { min-height: 110px; resize: vertical; }
    button {
      padding: 11px 16px; border: 0; border-radius: 10px;
      background: #245da8; color: white; font: inherit; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button.secondary { background: #e9eef6; color: #203653; }
    button.danger { background: #b42332; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .status {
      color: #68758a; font-size: 13px; white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .message { padding: 14px 0; border-bottom: 1px solid #e8edf4; }
    .message:last-child { border-bottom: 0; }
    .message-content { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.65; }
    .message-time { margin-top: 7px; font-size: 12px; color: #8490a2; }
    .empty { padding: 24px 0; text-align: center; color: #8490a2; }
    .warning {
      font-size: 13px; line-height: 1.6; color: #8b3c21;
      background: #fff4eb; padding: 12px; border-radius: 10px; margin-bottom: 14px;
    }
    footer { text-align: center; color: #8993a4; font-size: 12px; padding: 10px 0 24px; }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>lucky作业通</h1>
      <p>留言板 · 你的建议，我们认真倾听</p>
    </header>

    <section class="panel">
      <h2>提交留言</h2>
      <form id="messageForm">
        <label for="messageInput">留言内容</label>
        <textarea id="messageInput" maxlength="2000"
          placeholder="请输入你的留言或建议……" required></textarea>
        <div class="toolbar">
          <button id="submitBtn" type="submit">提交留言</button>
          <span id="submitStatus" class="status" role="status"></span>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="toolbar" style="justify-content:space-between">
        <h2 style="margin:0">云端留言</h2>
        <button id="refreshBtn" class="secondary" type="button">刷新留言</button>
      </div>
      <p id="listStatus" class="status" role="status">正在加载云端消息……</p>
      <div id="messageList" aria-live="polite"></div>
    </section>

    <section class="panel">
      <h2>管理员操作</h2>
      <div class="warning">
        此操作会删除云端全部留言，且无法通过本页面恢复。请谨慎操作。
      </div>
      <form id="adminForm">
        <label for="adminPassword">管理员口令</label>
        <input id="adminPassword" type="password"
          autocomplete="current-password" maxlength="256"
          placeholder="输入管理员口令" required>
        <button id="clearBtn" class="danger" type="submit">清空全部留言</button>
        <p id="adminStatus" class="status" role="status"></p>
      </form>
    </section>

    <footer>lucky作业通 · 留言板</footer>
  </main>

  <script>
    "use strict";

    const SUPABASE_URL =
      "https://mlfgkximylqcggggfmdf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_QTjDwTuc4F-AW38DxBfbdg_SCSdYQo_";

    const CLEAR_FUNCTION_URL =
      SUPABASE_URL + "/functions/v1/admin-clear-messages";

    const $ = (id) => document.getElementById(id);

    function setStatus(id, message) {
      $(id).textContent = message;
    }

    async function api(path, options = {}) {
      const response = await fetch(
        SUPABASE_URL + "/rest/v1/" + path,
        {
          ...options,
          headers: {
            apikey: SUPABASE_KEY,
            "Content-Type": "application/json",
            ...(options.headers || {})
          }
        }
      );

      const text = await response.text();
      let data = null;

      try {
        data = text ? JSON.parse(text) : null;
      } catch {
        data = text;
      }

      if (!response.ok) {
        const message = data && typeof data === "object"
          ? data.message || data.details || data.hint
          : data;
        throw new Error(message || "请求失败，HTTP " + response.status);
      }

      return data;
    }

    function formatTime(value) {
      if (!value) return "时间未知";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "时间未知";

      return date.toLocaleString("zh-CN", {
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit"
      });
    }

    function renderMessages(rows) {
      const list = $("messageList");
      list.replaceChildren();

      if (!Array.isArray(rows) || rows.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "目前还没有留言";
        list.appendChild(empty);
        return;
      }

      for (const row of rows) {
        const item = document.createElement("article");
        item.className = "message";

        const content = document.createElement("div");
        content.className = "message-content";
        content.textContent = row.content || "";

        const time = document.createElement("div");
        time.className = "message-time";
        time.textContent = formatTime(row.create_time);

        item.append(content, time);
        list.appendChild(item);
      }
    }

    async function loadMessages() {
      $("refreshBtn").disabled = true;
      setStatus("listStatus", "正在加载云端消息……");

      try {
        const rows = await api(
          "suggestions?select=id,content,create_time&order=id.desc&limit=500"
        );
        renderMessages(rows);
        setStatus("listStatus", "加载完成，共 " + rows.length + " 条留言。");
      } catch (error) {
        setStatus("listStatus",
          "读取失败，请检查 Publishable key、Data API 和 RLS 读取策略。\n" +
          error.message);
      } finally {
        $("refreshBtn").disabled = false;
      }
    }

    $("refreshBtn").addEventListener("click", loadMessages);

    $("messageForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = $("submitBtn");
      const content = $("messageInput").value.trim();

      if (!content) {
        setStatus("submitStatus", "请先输入留言内容。");
        return;
      }

      const button = $("submitBtn");
      button.disabled = true;
      setStatus("submitStatus", "正在提交……");

      try {
        await api("suggestions", {
          method: "POST",
          headers: { Prefer: "return=minimal" },
          body: JSON.stringify({ content })
        });

        $("messageInput").value = "";
        setStatus("submitStatus", "留言提交成功。");
        await loadMessages();
      } catch (error) {
        setStatus("submitStatus", "提交失败：" + error.message);
      } finally {
        button.disabled = false;
      }
    });

    $("adminForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = $("adminPassword").value;

      if (!password) {
        setStatus("adminStatus", "请输入管理员口令。");
        return;
      }

      if (!confirm("确定要删除云端全部留言吗？此操作无法撤销！")) {
        return;
      }

      const button = $("clearBtn");
      button.disabled = true;
      setStatus("adminStatus", "正在验证管理员……");

      try {
        const response = await fetch(CLEAR_FUNCTION_URL, {
          method: "POST",
          headers: {
            apikey: SUPABASE_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            password,
            confirm: true
          })
        });

        const text = await response.text();
        let result;

        try {
          result = text ? JSON.parse(text) : {};
        } catch {
          throw new Error("服务器返回内容无法解析");
        }

        if (!response.ok || !result.success) {
          throw new Error(result.error || "操作失败，HTTP " + response.status);
        }

        $("adminPassword").value = "";
        await loadMessages();
        setStatus("adminStatus", "留言已清空。");
      } catch (error) {
        setStatus("adminStatus", "操作失败：" + error.message);
      } finally {
        button.disabled = false;
      }
    });

    window.loadMessages = loadMessages;
    loadMessages();
  </script>
</body>
</html>
