
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1f44">
<title>lucky作业通 · 留言板</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:22px 16px;min-height:100vh;
  background:#0a1f44;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif
}
.container{max-width:760px;margin:auto}
header{
  padding:26px;margin-bottom:20px;border-radius:16px;
  background:linear-gradient(135deg,#122c5c,#1d4e89);
  box-shadow:0 4px 16px #0004
}
h1{text-align:center;margin:0 0 8px;font-size:27px;letter-spacing:2px}
header p{text-align:center;margin:0;color:#c6dcff;font-size:14px}
.card{
  background:#122c5c;border-radius:14px;padding:22px;
  margin-bottom:18px;box-shadow:0 4px 16px #0003
}
h2{margin:0 0 16px;font-size:19px;color:#d6e4ff}
label{font-size:14px;color:#d6e4ff}
textarea,input{
  display:block;width:100%;margin:8px 0 12px;padding:12px;
  border:1px solid #294879;border-radius:9px;
  background:#0d244e;color:#fff;font:inherit;outline:none
}
textarea{min-height:120px;resize:vertical;line-height:1.6}
textarea::placeholder,input::placeholder{color:#8aa4cc}
button{
  border:0;border-radius:8px;padding:11px 16px;
  background:#2563eb;color:#fff;font:inherit;cursor:pointer
}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.55;cursor:not-allowed}
.secondary{background:#315078}
.danger{background:#dc2626}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{
  margin:10px 0 0;min-height:18px;color:#a9c5ef;
  font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere
}
.tip{margin-top:10px;color:#9db8e0;font-size:13px;line-height:1.6}
.msg-item{
  background:#0d244e;padding:14px;border-radius:9px;
  margin:12px 0;border:1px solid #1b3b6b
}
.msg-content{line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-time{margin-top:8px;color:#8faad1;font-size:12px}
.msg-actions{margin-top:12px}
.empty{padding:24px 0;color:#9db8e0;text-align:center}
.hidden{display:none!important}
footer{text-align:center;color:#7895bf;font-size:12px;padding:6px 0 20px}
</style>
</head>
<body>
<main class="container">
<header>
  <h1>lucky作业通</h1>
  <p>留言板 · 你的建议，我们认真倾听</p>
</header>

<section class="card">
  <h2>提交留言</h2>
  <form id="messageForm">
    <label for="messageInput">留言内容（匿名提交）</label>
    <textarea id="messageInput" maxlength="2000"
      placeholder="请输入你的留言或建议……" required></textarea>
    <button id="submitBtn" type="submit">提交留言</button>
    <p id="submitStatus" class="status" role="status"></p>
  </form>
</section>

<section class="card">
  <h2>管理员查看留言</h2>
  <form id="adminForm">
    <label for="adminKey">开发者密钥</label>
    <input id="adminKey" type="password" maxlength="256"
      autocomplete="off" placeholder="输入密钥后查看留言" required>
    <div class="toolbar">
      <button id="loginBtn" type="submit">验证并查看</button>
      <button id="logoutBtn" class="secondary hidden" type="button">退出管理员模式</button>
    </div>
    <p id="adminStatus" class="status" role="status"></p>
  </form>
</section>

<section id="adminPanel" class="card hidden">
  <div class="toolbar" style="justify-content:space-between">
    <h2 style="margin:0">云端留言</h2>
    <button id="refreshBtn" class="secondary" type="button">刷新</button>
  </div>
  <p class="tip">管理员模式已开启。留言保存在 Supabase 云端。</p>
  <div class="toolbar" style="margin-top:14px">
    <button id="exportBtn" class="secondary" type="button">导出 CSV</button>
    <button id="clearBtn" class="danger" type="button">清空全部留言</button>
  </div>
  <p id="listStatus" class="status" role="status">尚未加载。</p>
  <div id="messageList"></div>
</section>

<footer>lucky作业通 · 留言板</footer>
</main>

<script>
"use strict";

const SUPABASE_URL =
  "https://mlfgkximylqcggggfmdf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_QTjDwTuc4F-AW38DxBfbdg_SCSdYQo_";

const DEV_KEY = "lqy825825";

const $ = id => document.getElementById(id);

let adminUnlocked = false;
let cachedMessages = [];

function setStatus(id, message) {
  $(id).textContent = message;
}

async function api(path, options = {}) {
  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/${path}`,
    {
      ...options,
      headers: {
        apikey: SUPABASE_KEY,
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    }
  );

  const raw = await response.text();
  let data = null;

  try {
    data = raw ? JSON.parse(raw) : null;
  } catch {
    data = raw;
  }

  if (!response.ok) {
    const message = data && typeof data === "object"
      ? data.message || data.details || data.hint
      : data;

    throw new Error(
      message || `请求失败（HTTP ${response.status}）`
    );
  }

  return data;
}

function formatTime(value) {
  if (!value) return "时间未知";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) return value;

  return date.toLocaleString("zh-CN");
}

function renderMessages(rows) {
  const list = $("messageList");
  list.replaceChildren();

  if (!rows.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "目前还没有留言";
    list.appendChild(empty);
    return;
  }

  for (const row of rows) {
    const item = document.createElement("article");
    item.className = "msg-item";

    const content = document.createElement("div");
    content.className = "msg-content";
    content.textContent = row.content || "";

    const time = document.createElement("div");
    time.className = "msg-time";
    time.textContent = "提交时间：" + formatTime(row.create_time);

    const actions = document.createElement("div");
    actions.className = "toolbar msg-actions";

    const del = document.createElement("button");
    del.type = "button";
    del.className = "danger";
    del.textContent = "删除此条";
    del.addEventListener("click", () => deleteMessage(row.id));

    actions.appendChild(del);
    item.append(content, time, actions);
    list.appendChild(item);
  }
}

async function loadMessages() {
  if (!adminUnlocked) return;

  $("refreshBtn").disabled = true;
  setStatus("listStatus", "正在读取云端留言……");

  try {
    const rows = await api(
      "suggestions?select=id,content,create_time&order=id.desc&limit=1000"
    );

    cachedMessages = Array.isArray(rows) ? rows : [];
    renderMessages(cachedMessages);

    setStatus(
      "listStatus",
      `加载完成，共 ${cachedMessages.length} 条留言。`
    );
  } catch (error) {
    setStatus(
      "listStatus",
      `读取失败：${error.message}\n请检查 Publishable key、Data API 和 RLS 的 SELECT 策略。`
    );
  } finally {
    $("refreshBtn").disabled = false;
  }
}

$("messageForm").addEventListener("submit", async event => {
  event.preventDefault();

  const button = $("submitBtn");
  const content = $("messageInput").value.trim();

  if (!content) {
    setStatus("submitStatus", "请先输入留言内容。");
    return;
  }

  button.disabled = true;
  setStatus("submitStatus", "正在提交……");

  try {
    await api("suggestions", {
      method: "POST",
      headers: { Prefer: "return=minimal" },
      body: JSON.stringify({ content })
    });

    $("messageInput").value = "";
    setStatus("submitStatus", "提交成功，感谢你的建议！");

    if (adminUnlocked) {
      await loadMessages();
    }
  } catch (error) {
    setStatus("submitStatus", "提交失败：" + error.message);
  } finally {
    button.disabled = false;
  }
});

$("adminForm").addEventListener("submit", async event => {
  event.preventDefault();

  const enteredKey = $("adminKey").value;

  if (enteredKey !== DEV_KEY) {
    adminUnlocked = false;
    $("adminPanel").classList.add("hidden");
    $("logoutBtn").classList.add("hidden");
    setStatus("adminStatus", "密钥错误。");
    return;
  }

  adminUnlocked = true;
  $("adminPanel").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");
  $("adminKey").value = "";

  setStatus("adminStatus", "验证成功。");
  await loadMessages();
});

$("logoutBtn").addEventListener("click", () => {
  adminUnlocked = false;
  cachedMessages = [];

  $("adminPanel").classList.add("hidden");
  $("logoutBtn").classList.add("hidden");
  $("messageList").replaceChildren();

  setStatus("adminStatus", "已退出管理员模式。");
  setStatus("listStatus", "尚未加载。");
});

$("refreshBtn").addEventListener("click", loadMessages);

async function deleteMessage(id) {
  if (!adminUnlocked) return;

  if (!confirm(`确定删除 ID 为 ${id} 的留言吗？此操作无法撤销。`)) {
    return;
  }

  try {
    await api(
      `suggestions?id=eq.${encodeURIComponent(id)}`,
      {
        method: "DELETE",
        headers: { Prefer: "return=minimal" }
      }
    );

    await loadMessages();
  } catch (error) {
    setStatus(
      "listStatus",
      `删除失败：${error.message}\n请检查 suggestions 表的 DELETE RLS 策略。`
    );
  }
}

$("clearBtn").addEventListener("click", async () => {
  if (!adminUnlocked) return;

  if (!confirm("确定清空全部留言吗？此操作无法撤销！")) {
    return;
  }

  if (!confirm("再次确认：真的要删除所有云端留言吗？")) {
    return;
  }

  $("clearBtn").disabled = true;

  try {
    await api(
      "suggestions?id=gte.0",
      {
        method: "DELETE",
        headers: { Prefer: "return=minimal" }
      }
    );

    await loadMessages();
    setStatus("listStatus", "清空请求已完成。");
  } catch (error) {
    setStatus(
      "listStatus",
      `清空失败：${error.message}\n请检查 suggestions 表的 DELETE RLS 策略。`
    );
  } finally {
    $("clearBtn").disabled = false;
  }
});

function csvCell(value) {
  let text = String(value ?? "");

  if (/^[=+\-@\t\r]/.test(text)) {
    text = "'" + text;
  }

  return '"' + text.replace(/"/g, '""') + '"';
}

$("exportBtn").addEventListener("click", () => {
  if (!adminUnlocked) return;

  const rows = [
    ["ID", "留言内容", "提交时间"],
    ...cachedMessages.map(row => [
      row.id, row.content, row.create_time
    ])
  ];

  const csv = "\uFEFF" +
    rows.map(row => row.map(csvCell).join(",")).join("\r\n");

  const blob = new Blob(
    [csv],
    { type: "text/csv;charset=utf-8;" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "lucky-zuoyetong-messages.csv";

  document.body.appendChild(link);
  link.click();
  link.remove();

  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
